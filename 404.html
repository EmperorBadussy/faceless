<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — FACELESS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23D4A006'>F</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0F0D06; color:#D4A006; font-family:'JetBrains Mono',monospace; min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; overflow:hidden; }
  canvas { position:fixed; inset:0; z-index:0; }
  .content { position:relative; z-index:1; text-align:center; padding:2rem; }
  .error-code { font-family:'Orbitron',monospace; font-size:clamp(5rem,15vw,12rem); font-weight:900; line-height:1; animation:glitch404 0.15s infinite; color:#D4A006; text-shadow:0 0 40px rgba(212,160,6,0.3); }
  .error-msg { font-size:clamp(1rem,3vw,1.5rem); color:#EED322; margin:1rem 0 0.5rem; letter-spacing:0.3em; font-family:'Orbitron',monospace; }
  .error-sub { color:#644D0E; font-size:0.85rem; margin-bottom:2rem; }
  .back-btn { display:inline-block; padding:0.8rem 2rem; border:1px solid #D4A006; color:#D4A006; text-decoration:none; font-family:'Orbitron',monospace; font-size:0.8rem; letter-spacing:0.15em; transition:all 0.3s; }
  .back-btn:hover { background:#D4A006; color:#0F0D06; box-shadow:0 0 30px rgba(212,160,6,0.4); }
  @keyframes glitch404 {
    0%,100% { text-shadow:-3px 0 #EED322, 3px 0 #D4A006, 0 0 40px rgba(212,160,6,0.3); }
    25% { text-shadow:3px 0 #EED322, -3px 0 #D4A006; transform:translateX(-2px); }
    50% { text-shadow:-2px 0 #F9E867, 2px 0 #D4A006; }
    75% { text-shadow:2px 0 #EED322, -2px 0 #F9E867; transform:translateX(2px); }
  }
</style>
</head>
<body>
<canvas id="staticCanvas"></canvas>
<div class="content">
  <div class="error-code">404</div>
  <div class="error-msg">SIGNAL LOST</div>
  <p class="error-sub">The face you're looking for doesn't exist. Or maybe it never did.</p>
  <a href="/" class="back-btn">← RETURN TO BASE</a>
</div>
<script>
const canvas = document.getElementById('staticCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
function drawStatic() {
  const imageData = ctx.createImageData(canvas.width, canvas.height);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const v = Math.random() * 25;
    data[i] = v * 1.2; data[i+1] = v * 0.9; data[i+2] = v * 0.3; data[i+3] = 255;
  }
  ctx.putImageData(imageData, 0, 0);
  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  for (let y = 0; y < canvas.height; y += 3) {
    ctx.fillRect(0, y, canvas.width, 1);
  }
  // Random glitch bars
  if (Math.random() < 0.05) {
    const y = Math.random() * canvas.height;
    const h = Math.random() * 20 + 5;
    ctx.fillStyle = 'rgba(212,160,6,0.08)';
    ctx.fillRect(0, y, canvas.width, h);
  }
  requestAnimationFrame(drawStatic);
}
drawStatic();
</script>
</body>
</html>
